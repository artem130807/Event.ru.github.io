services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eventrep-backend:local
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: eventrep-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-80}:80"
