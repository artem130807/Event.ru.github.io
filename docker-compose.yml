services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eventrep-backend:local
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-18081}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: eventrep-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18080}:80"
