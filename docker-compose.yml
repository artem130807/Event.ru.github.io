services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eventrep-backend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: eventrep-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18080}:80"
